name: Validate MUKHTABAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML, every inline script, JavaScript and Worker configuration
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="ar" dir="rtl">' in source, "Arabic RTL document root is missing"
          assert "$('.tab').forEach" not in source.replace("$('.tab').forEach", ""), "A single DOM element is being treated as a collection"

          class DocumentChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicates = []
                  self.inline_scripts = []
                  self.in_inline_script = False
                  self.current_script = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("id")
                  if value:
                      if value in self.ids:
                          self.duplicates.append(value)
                      self.ids.add(value)
                  if tag.lower() == "script":
                      self.in_inline_script = "src" not in attrs
                      self.current_script = []
              def handle_data(self, data):
                  if self.in_inline_script:
                      self.current_script.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_inline_script:
                      code = "".join(self.current_script)
                      if code.strip():
                          self.inline_scripts.append(code)
                      self.in_inline_script = False
                      self.current_script = []

          checker = DocumentChecker()
          checker.feed(source)
          assert not checker.duplicates, f"Duplicate HTML IDs: {checker.duplicates}"
          assert checker.inline_scripts, "Inline JavaScript scripts not found"
          for number, code in enumerate(checker.inline_scripts):
              Path(f"inline-check-{number}.mjs").write_text(code, encoding="utf-8")
          print(f"HTML checked; {len(checker.ids)} unique IDs and {len(checker.inline_scripts)} inline scripts found.")
          PY
          for file in inline-check-*.mjs; do node --check "$file"; done
          node --check simulation-engine.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const sandbox = { window: {} };
          vm.createContext(sandbox);
          vm.runInContext(fs.readFileSync('simulation-engine.js', 'utf8'), sandbox);
          const api = sandbox.window.MUKHTABAR_ENGINE;
          assert.ok(api, 'simulation engine must export its API');
          const spec = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'تجربة شقي يونغ',
            field: 'physics',
            engine: 'interference',
            controls: []
          });
          assert.equal(spec.engine, 'interference');
          assert.deepEqual(Array.from(spec.controls, c => c.key), ['wavelength', 'separation', 'distance']);
          assert.deepEqual(Array.from(spec.controls, c => c.value), [550, 0.25, 1.5]);
          const induction = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'المولد الكهربائي',
            field: 'physics',
            engine: 'induction',
            controls: []
          });
          assert.equal(induction.engine, 'induction');
          assert.deepEqual(Array.from(induction.controls, c => c.key), ['field', 'area', 'turns', 'angular_speed', 'resistance']);
          assert.deepEqual(Array.from(induction.controls, c => c.value), [0.8, 0.04, 100, 12, 4]);
          const diffraction = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'محزوز الحيود',
            field: 'physics',
            engine: 'diffraction',
            controls: []
          });
          assert.equal(diffraction.engine, 'diffraction');
          assert.deepEqual(Array.from(diffraction.controls, c => c.key), ['wavelength', 'grating_spacing', 'slit_count', 'slit_width', 'distance']);
          assert.deepEqual(Array.from(diffraction.controls, c => c.value), [550, 5, 5, 0.35, 1.5]);
          const dipole = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'المجال المغناطيسي لثنائي القطب',
            field: 'physics',
            engine: 'dipole',
            controls: []
          });
          assert.equal(dipole.engine, 'dipole');
          assert.deepEqual(Array.from(dipole.controls, c => c.key), ['moment', 'probe_radius', 'probe_angle', 'line_count']);
          assert.deepEqual(Array.from(dipole.controls, c => c.value), [2, 1.3, 45, 16]);
          const polarization = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'استقطاب الضوء',
            field: 'physics',
            engine: 'polarization',
            controls: []
          });
          assert.equal(polarization.engine, 'polarization');
          assert.deepEqual(Array.from(polarization.controls, c => c.key), ['angle', 'wavelength', 'source_intensity']);
          assert.deepEqual(Array.from(polarization.controls, c => c.value), [35, 550, 100]);
          const malus0 = api.malusLaw(1, 0);
          const malus45 = api.malusLaw(1, 45);
          const malus90 = api.malusLaw(1, 90);
          assert.ok(Math.abs(malus0.output - 0.5) < 1e-12);
          assert.ok(Math.abs(malus45.output - 0.25) < 1e-12);
          assert.ok(malus90.output < 1e-12);
          const axial = api.dipoleField(2, 1, 0);
          const equatorial = api.dipoleField(2, 1, 90);
          assert.ok(Math.abs(axial.magnitude - 4e-7) < 1e-15);
          assert.ok(Math.abs(equatorial.magnitude - 2e-7) < 1e-15);
          const photoelectric = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'التأثير الكهروضوئي',
            field: 'physics',
            engine: 'photoelectric',
            controls: []
          });
          assert.equal(photoelectric.engine, 'photoelectric');
          assert.deepEqual(Array.from(photoelectric.controls, c => c.key), ['wavelength', 'work_function', 'intensity']);
          assert.deepEqual(Array.from(photoelectric.controls, c => c.value), [365, 2.3, 75]);
          const photoAbove = api.photoelectric(365, 2.3, 75);
          const photoDim = api.photoelectric(365, 2.3, 10);
          const photoBelow = api.photoelectric(700, 2.3, 100);
          assert.ok(Math.abs(photoAbove.photonEnergy - 1239.841984 / 365) < 1e-12);
          assert.ok(Math.abs(photoAbove.kineticEnergy - (1239.841984 / 365 - 2.3)) < 1e-12);
          assert.equal(photoAbove.emission, true);
          assert.ok(Math.abs(photoAbove.kineticEnergy - photoDim.kineticEnergy) < 1e-12);
          assert.ok(photoDim.relativeEmissionRate < photoAbove.relativeEmissionRate);
          assert.equal(photoBelow.emission, false);
          assert.equal(photoBelow.kineticEnergy, 0);
          const decay = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'الاضمحلال الإشعاعي',
            field: 'physics',
            engine: 'decay',
            controls: []
          });
          assert.equal(decay.engine, 'decay');
          assert.deepEqual(Array.from(decay.controls, c => c.key), ['half_life', 'initial_atoms', 'rate']);
          assert.deepEqual(Array.from(decay.controls, c => c.value), [6, 200, 1]);
          const decayStart = api.decayLaw(200, 6, 0);
          const decayHalf = api.decayLaw(200, 6, 6);
          const medianLifetime = api.sampleDecayTime(.5, 6);
          assert.ok(Math.abs(decayStart.expectedRemaining - 200) < 1e-12);
          assert.ok(Math.abs(decayHalf.expectedRemaining - 100) < 1e-12);
          assert.ok(Math.abs(decayHalf.decayConstant - Math.LN2 / 6) < 1e-12);
          assert.ok(Math.abs(medianLifetime - 6) < 1e-12);
          console.log('Optics, dipole, photoelectric and radioactive-decay physics/schema checks passed.');
          NODE
          node --check ai-worker/worker.js
          node --check ai-config.js
          node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8'))"
