name: Validate MUKHTABAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML, JavaScript and Worker configuration
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="ar" dir="rtl">' in source, "Arabic RTL document root is missing"

          class IdChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicates = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("id")
                  if value:
                      if value in self.ids:
                          self.duplicates.append(value)
                      self.ids.add(value)

          checker = IdChecker()
          checker.feed(source)
          assert not checker.duplicates, f"Duplicate HTML IDs: {checker.duplicates}"

          match = re.search(r"<script(?![^>]*src=)[^>]*>(.*?)</script>", source, re.S)
          assert match, "Inline JavaScript script not found"
          Path("module-check.mjs").write_text(match.group(1), encoding="utf-8")
          print(f"HTML structure checked; {len(checker.ids)} unique IDs found.")
          PY
          node --check module-check.mjs
          node --check ai-worker/worker.js
          node --check ai-config.js
          node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8'))"
