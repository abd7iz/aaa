name: Validate MUKHTABAR

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check HTML, every inline script, JavaScript and Worker configuration
        run: |
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import re

          source = Path("index.html").read_text(encoding="utf-8")
          assert '<html lang="ar" dir="rtl">' in source, "Arabic RTL document root is missing"
          assert "$('.tab').forEach" not in source.replace("$('.tab').forEach", ""), "A single DOM element is being treated as a collection"

          class DocumentChecker(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.ids = set()
                  self.duplicates = []
                  self.inline_scripts = []
                  self.in_inline_script = False
                  self.current_script = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  value = attrs.get("id")
                  if value:
                      if value in self.ids:
                          self.duplicates.append(value)
                      self.ids.add(value)
                  if tag.lower() == "script":
                      self.in_inline_script = "src" not in attrs
                      self.current_script = []
              def handle_data(self, data):
                  if self.in_inline_script:
                      self.current_script.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.in_inline_script:
                      code = "".join(self.current_script)
                      if code.strip():
                          self.inline_scripts.append(code)
                      self.in_inline_script = False
                      self.current_script = []

          checker = DocumentChecker()
          checker.feed(source)
          assert not checker.duplicates, f"Duplicate HTML IDs: {checker.duplicates}"
          assert checker.inline_scripts, "Inline JavaScript scripts not found"
          for experiment_id in ("tokamak", "wave", "pendulum"):
              assert f"EXPS.{experiment_id}.id = '{experiment_id}';" in source, f"Missing built-in experiment: {experiment_id}"
          for number, code in enumerate(checker.inline_scripts):
              Path(f"inline-check-{number}.mjs").write_text(code, encoding="utf-8")
          print(f"HTML checked; {len(checker.ids)} unique IDs and {len(checker.inline_scripts)} inline scripts found.")
          PY
          for file in inline-check-*.mjs; do node --check "$file"; done
          node --check simulation-engine.js
          node - <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const engineSource = fs.readFileSync('simulation-engine.js', 'utf8');
          const branchMarkers = [
            "if (spec.engine === 'tokamak') {",
            "} else if (spec.engine === 'interference') {",
            "} else if (spec.engine === 'induction') {",
            "} else if (spec.engine === 'bohr') {",
            "} else if (spec.engine === 'decay') {",
            "} else if (spec.engine === 'photoelectric') {",
            "} else if (spec.engine === 'polarization') {",
            "} else if (spec.engine === 'dipole') {",
            "} else if (spec.engine === 'diffraction') {",
            "} else if (spec.engine === 'wave') {",
            "} else if (spec.engine === 'pendulum') {",
            "} else if (spec.engine === 'blackbody') {",
            "} else if (spec.engine === 'idealgas') {",
            "} else if (spec.engine === 'rlc') {"
          ];
          for (const marker of branchMarkers) assert.ok(engineSource.includes(marker), "Missing simulation branch: " + marker);
          const sandbox = { window: {} };
          vm.createContext(sandbox);
          vm.runInContext(engineSource, sandbox);
          const api = sandbox.window.MUKHTABAR_ENGINE;
          assert.ok(api, 'simulation engine must export its API');
          const spec = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'تجربة شقي يونغ',
            field: 'physics',
            engine: 'interference',
            controls: []
          });
          assert.equal(spec.engine, 'interference');
          assert.deepEqual(Array.from(spec.controls, c => c.key), ['wavelength', 'separation', 'distance']);
          assert.deepEqual(Array.from(spec.controls, c => c.value), [550, 0.25, 1.5]);
          const induction = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'المولد الكهربائي',
            field: 'physics',
            engine: 'induction',
            controls: []
          });
          assert.equal(induction.engine, 'induction');
          assert.deepEqual(Array.from(induction.controls, c => c.key), ['field', 'area', 'turns', 'angular_speed', 'resistance']);
          assert.deepEqual(Array.from(induction.controls, c => c.value), [0.8, 0.04, 100, 12, 4]);
          const diffraction = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'محزوز الحيود',
            field: 'physics',
            engine: 'diffraction',
            controls: []
          });
          assert.equal(diffraction.engine, 'diffraction');
          assert.deepEqual(Array.from(diffraction.controls, c => c.key), ['wavelength', 'grating_spacing', 'slit_count', 'slit_width', 'distance']);
          assert.deepEqual(Array.from(diffraction.controls, c => c.value), [550, 5, 5, 0.35, 1.5]);
          const dipole = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'المجال المغناطيسي لثنائي القطب',
            field: 'physics',
            engine: 'dipole',
            controls: []
          });
          assert.equal(dipole.engine, 'dipole');
          assert.deepEqual(Array.from(dipole.controls, c => c.key), ['moment', 'probe_radius', 'probe_angle', 'line_count']);
          assert.deepEqual(Array.from(dipole.controls, c => c.value), [2, 1.3, 45, 16]);
          const polarization = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'استقطاب الضوء',
            field: 'physics',
            engine: 'polarization',
            controls: []
          });
          assert.equal(polarization.engine, 'polarization');
          assert.deepEqual(Array.from(polarization.controls, c => c.key), ['angle', 'wavelength', 'source_intensity']);
          assert.deepEqual(Array.from(polarization.controls, c => c.value), [35, 550, 100]);
          const malus0 = api.malusLaw(1, 0);
          const malus45 = api.malusLaw(1, 45);
          const malus90 = api.malusLaw(1, 90);
          assert.ok(Math.abs(malus0.output - 0.5) < 1e-12);
          assert.ok(Math.abs(malus45.output - 0.25) < 1e-12);
          assert.ok(malus90.output < 1e-12);
          const axial = api.dipoleField(2, 1, 0);
          const equatorial = api.dipoleField(2, 1, 90);
          assert.ok(Math.abs(axial.magnitude - 4e-7) < 1e-15);
          assert.ok(Math.abs(equatorial.magnitude - 2e-7) < 1e-15);
          const tokamak = api.normalizeSpec({ schema: 'mukhtabar-sim-v1', title: 'توكاماك', field: 'physics', engine: 'tokamak', controls: [] });
          const wave = api.normalizeSpec({ schema: 'mukhtabar-sim-v1', title: 'موجة', field: 'physics', engine: 'wave', controls: [] });
          const pendulum = api.normalizeSpec({ schema: 'mukhtabar-sim-v1', title: 'بندول', field: 'physics', engine: 'pendulum', controls: [] });
          assert.deepEqual(Array.from(tokamak.controls, c => c.key), ['field', 'temperature', 'density']);
          assert.deepEqual(Array.from(wave.controls, c => c.key), ['amplitude', 'frequency', 'speed']);
          assert.deepEqual(Array.from(pendulum.controls, c => c.key), ['length', 'gravity', 'angle', 'damping']);
          const photoelectric = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'التأثير الكهروضوئي',
            field: 'physics',
            engine: 'photoelectric',
            controls: []
          });
          assert.equal(photoelectric.engine, 'photoelectric');
          assert.deepEqual(Array.from(photoelectric.controls, c => c.key), ['wavelength', 'work_function', 'intensity']);
          assert.deepEqual(Array.from(photoelectric.controls, c => c.value), [365, 2.3, 75]);
          const photoAbove = api.photoelectric(365, 2.3, 75);
          const photoDim = api.photoelectric(365, 2.3, 10);
          const photoBelow = api.photoelectric(700, 2.3, 100);
          assert.ok(Math.abs(photoAbove.photonEnergy - 1239.841984 / 365) < 1e-12);
          assert.ok(Math.abs(photoAbove.kineticEnergy - (1239.841984 / 365 - 2.3)) < 1e-12);
          assert.equal(photoAbove.emission, true);
          assert.ok(Math.abs(photoAbove.kineticEnergy - photoDim.kineticEnergy) < 1e-12);
          assert.ok(photoDim.relativeEmissionRate < photoAbove.relativeEmissionRate);
          assert.equal(photoBelow.emission, false);
          assert.equal(photoBelow.kineticEnergy, 0);
          const decay = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'الاضمحلال الإشعاعي',
            field: 'physics',
            engine: 'decay',
            controls: []
          });
          assert.equal(decay.engine, 'decay');
          assert.deepEqual(Array.from(decay.controls, c => c.key), ['half_life', 'initial_atoms', 'rate']);
          assert.deepEqual(Array.from(decay.controls, c => c.value), [6, 200, 1]);
          const decayStart = api.decayLaw(200, 6, 0);
          const decayHalf = api.decayLaw(200, 6, 6);
          const medianLifetime = api.sampleDecayTime(.5, 6);
          assert.ok(Math.abs(decayStart.expectedRemaining - 200) < 1e-12);
          assert.ok(Math.abs(decayHalf.expectedRemaining - 100) < 1e-12);
          assert.ok(Math.abs(decayHalf.decayConstant - Math.LN2 / 6) < 1e-12);
          assert.ok(Math.abs(medianLifetime - 6) < 1e-12);
          const bohr = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'طيف ذرة الهيدروجين',
            field: 'physics',
            engine: 'bohr',
            controls: []
          });
          assert.equal(bohr.engine, 'bohr');
          assert.deepEqual(Array.from(bohr.controls, c => c.key), ['atomic_number', 'initial_level', 'final_level']);
          assert.deepEqual(Array.from(bohr.controls, c => c.value), [1, 3, 2]);
          const hAlpha = api.bohrTransition(1, 3, 2);
          const lymanAlpha = api.bohrTransition(1, 2, 1);
          const absorption = api.bohrTransition(1, 1, 2);
          const noJump = api.bohrTransition(1, 2, 2);
          assert.equal(hAlpha.type, 'emission');
          assert.ok(Math.abs(hAlpha.energy - 1.88967958) < 1e-7);
          assert.ok(hAlpha.wavelength > 656 && hAlpha.wavelength < 657);
          assert.equal(lymanAlpha.type, 'emission');
          assert.ok(lymanAlpha.wavelength > 121 && lymanAlpha.wavelength < 122);
          assert.equal(absorption.type, 'absorption');
          assert.equal(noJump.type, 'none');
          assert.equal(noJump.wavelength, null);
          const blackbody = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'إشعاع الجسم الأسود',
            field: 'physics',
            engine: 'blackbody',
            controls: []
          });
          assert.equal(blackbody.engine, 'blackbody');
          assert.deepEqual(Array.from(blackbody.controls, c => c.key), ['temperature', 'surface_area']);
          assert.deepEqual(Array.from(blackbody.controls, c => c.value), [5800, 0.01]);
          const sunPeak = api.wienPeakNm(5800);
          assert.ok(sunPeak > 499 && sunPeak < 501);
          const peakValue = api.blackbodySpectrum(5800, sunPeak);
          assert.ok(peakValue > api.blackbodySpectrum(5800, sunPeak * .7));
          assert.ok(peakValue > api.blackbodySpectrum(5800, sunPeak * 1.4));
          const power = api.stefanBoltzmannPower(5800, .01);
          assert.ok(power > 600000 && power < 650000);
          const idealgas = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'قانون الغاز المثالي',
            field: 'physics',
            engine: 'idealgas',
            controls: []
          });
          assert.equal(idealgas.engine, 'idealgas');
          assert.deepEqual(Array.from(idealgas.controls, c => c.key), ['temperature', 'amount', 'volume']);
          assert.deepEqual(Array.from(idealgas.controls, c => c.value), [300, 0.1, 2.5]);
          const gasDefault = api.idealGasState(300, 0.1, 2.5);
          const gasDoubleTemp = api.idealGasState(600, 0.1, 2.5);
          const gasDoubleVolume = api.idealGasState(300, 0.1, 5);
          assert.ok(gasDefault.pressurePa > 99700 && gasDefault.pressurePa < 99900);
          assert.ok(Math.abs(gasDoubleTemp.pressurePa / gasDefault.pressurePa - 2) < 1e-12);
          assert.ok(Math.abs(gasDoubleVolume.pressurePa / gasDefault.pressurePa - .5) < 1e-12);
          assert.ok(gasDefault.mostProbableSpeed > 420 && gasDefault.mostProbableSpeed < 430);
          assert.ok(gasDefault.meanSpeed > 470 && gasDefault.meanSpeed < 480);
          assert.ok(gasDefault.rmsSpeed > 510 && gasDefault.rmsSpeed < 520);
          assert.ok(Math.abs(gasDefault.meanSpeed / gasDefault.rmsSpeed - Math.sqrt(8 / (3 * Math.PI))) < 1e-12);
          assert.ok(Math.abs(gasDefault.mostProbableSpeed / gasDefault.rmsSpeed - Math.sqrt(2 / 3)) < 1e-12);
          assert.ok(Math.abs(gasDoubleTemp.rmsSpeed / gasDefault.rmsSpeed - Math.sqrt(2)) < 1e-12);
          const rlc = api.normalizeSpec({
            schema: 'mukhtabar-sim-v1',
            title: 'دائرة RLC',
            field: 'physics',
            engine: 'rlc',
            controls: []
          });
          assert.equal(rlc.engine, 'rlc');
          assert.deepEqual(Array.from(rlc.controls, c => c.key), ['voltage', 'resistance', 'inductance', 'capacitance', 'frequency']);
          assert.deepEqual(Array.from(rlc.controls, c => c.value), [12, 20, 100, 100, 50]);
          const L = 0.1, C = 100e-6;
          const f0 = 1 / (2 * Math.PI * Math.sqrt(L * C));
          const atResonance = api.rlcState(12, 20, 100, 100, f0);
          const belowResonance = api.rlcState(12, 20, 100, 100, 25);
          const aboveResonance = api.rlcState(12, 20, 100, 100, 75);
          assert.ok(Math.abs(atResonance.inductiveReactance - atResonance.capacitiveReactance) < 1e-9);
          assert.ok(Math.abs(atResonance.impedance - 20) < 1e-9);
          assert.ok(Math.abs(atResonance.currentPeak - 0.6) < 1e-9);
          assert.ok(Math.abs(atResonance.phaseDegrees) < 1e-8);
          assert.ok(Math.abs(atResonance.resonanceFrequency - f0) < 1e-9);
          assert.ok(belowResonance.phaseDegrees < 0, 'Below resonance the series circuit should be capacitive');
          assert.ok(aboveResonance.phaseDegrees > 0, 'Above resonance the series circuit should be inductive');
          console.log('Optics, atomic spectra, blackbody, ideal-gas, RLC resonance and other physics/schema checks passed.');
          NODE
          node --check ai-worker/worker.js
          node --check ai-config.js
          node -e "JSON.parse(require('node:fs').readFileSync('wrangler.jsonc', 'utf8'))"
