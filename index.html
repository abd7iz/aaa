.en{font-size:11px;letter-spacing:3px;color:var(--ac);direction:ltr;display:block}

/* ---------- Storage (IndexedDB with localStorage fallback) ---------- */
var DB=(function(){
  var LS='mukhtabar_experiments_v1';
  var ready=new Promise(function(res){
    if(!window.indexedDB)return res(null);
    try{
      var r=indexedDB.open('mukhtabar',1);
      r.onupgradeneeded=function(){r.result.createObjectStore('experiments',{keyPath:'id'});};
      r.onsuccess=function(){res(r.result);};
      r.onerror=function(){res(null);};
      r.onblocked=function(){res(null);};
    }catch(e){res(null);}
  });
  function idb(db,mode,fn){
    return new Promise(function(res,rej){
      var t=db.transaction('experiments',mode),rq=fn(t.objectStore('experiments'));
      t.oncomplete=function(){res(rq?rq.result:undefined);};
      t.onerror=t.onabort=function(){rej(t.error);};
    });
  }
  function lsAll(){try{return JSON.parse(localStorage.getItem(LS)||'[]');}catch(e){return [];}}
  function lsSave(a){localStorage.setItem(LS,JSON.stringify(a));}
  return {
    all:function(){return ready.then(function(db){
      var p=db?idb(db,'readonly',function(s){return s.getAll();}):Promise.resolve(lsAll());
      return p.then(function(l){return (l||[]).sort(function(a,b){return b.updatedAt-a.updatedAt;});});
    });},
    get:function(id){return ready.then(function(db){
      if(db)return idb(db,'readonly',function(s){return s.get(id);});
      return lsAll().filter(function(x){return x.id===id;})[0];
    });},
    put:function(item){return ready.then(function(db){
      if(db)return idb(db,'readwrite',function(s){return s.put(item);});
      var a=lsAll().filter(function(x){return x.id!==item.id;});a.push(item);lsSave(a);
    });},
    del:function(id){return ready.then(function(db){
      if(db)return idb(db,'readwrite',function(s){return s.delete(id);});
      lsSave(lsAll().filter(function(x){return x.id!==id;}));
    });},
    clear:function(){return ready.then(function(db){
      if(db)return idb(db,'readwrite',function(s){return s.clear();});
      lsSave([]);
    });},
    persist:function(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}
  };
})();

/* ---------- UI helpers ---------- */

/* ---------- 3D stage (own tiny orbit controls: drag = rotate, pinch/wheel = zoom) ---------- */
function makeStage(host,o){
  var T=THREE;
  var renderer=new T.WebGLRenderer({antialias:false,alpha:true,powerPreference:'low-power',preserveDrawingBuffer:false});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.25));
  var cv=renderer.domElement;cv.className='gl';host.appendChild(cv);
  var scene=new T.Scene();
  var camera=new T.PerspectiveCamera(50,1,0.1,600);
  var target=new T.Vector3().fromArray(o.target||[0,0,0]);
  var sph={r:o.dist||8,th:o.th||0.6,ph:o.ph||1.2};
  var minR=o.minR||2,maxR=o.maxR||60,fitDone=false;
  function place(){
    var s=Math.sin(sph.ph);
    camera.position.set(target.x+sph.r*s*Math.sin(sph.th),target.y+sph.r*Math.cos(sph.ph),target.z+sph.r*s*Math.cos(sph.th));
    camera.lookAt(target);
  }
  function resize(){
    var w=host.clientWidth||300,h=host.clientHeight||300;
    renderer.setSize(w,h,false);camera.aspect=w/h;
    if(o.fitW&&!fitDone){fitDone=true;sph.r=clamp(Math.max(sph.r,o.fitW/(Math.tan(camera.fov*Math.PI/360)*camera.aspect)),minR,maxR);}
    camera.updateProjectionMatrix();place();
  }
  var ptr=new Map(),pd=0;
  cv.addEventListener('pointerdown',function(e){
    try{cv.setPointerCapture(e.pointerId);}catch(x){}
    ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptr.size===2){var v=Array.from(ptr.values());pd=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);}
  });
  cv.addEventListener('pointermove',function(e){
    var p=ptr.get(e.pointerId);if(!p)return;
    var dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
    if(ptr.size===1){sph.th-=dx*0.008;sph.ph=clamp(sph.ph-dy*0.008,0.12,Math.PI-0.12);}
    else if(ptr.size===2){var v=Array.from(ptr.values()),d=Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y);if(pd&&d)sph.r=clamp(sph.r*pd/d,minR,maxR);pd=d;}
    place();
  });
  function up(e){ptr.delete(e.pointerId);pd=0;}
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
  cv.addEventListener('wheel',function(e){e.preventDefault();sph.r=clamp(sph.r*(1+e.deltaY*0.001),minR,maxR);place();},{passive:false});
  var clock=new T.Clock(),raf=0,dead=false;
  var api={scene:scene,camera:camera,target:target,sph:sph,place:place,renderer:renderer};
  function loop(){
    if(dead)return;
    raf=requestAnimationFrame(loop);
    var dt=Math.min(clock.getDelta(),0.05);
    try{if(o.update)o.update(dt);}catch(err){console.error(err);dead=true;return;}
    renderer.render(scene,camera);
  }
  var ro=new ResizeObserver(resize);ro.observe(host);resize();
  raf=requestAnimationFrame(loop);
  api.dispose=function(){
    dead=true;cancelAnimationFrame(raf);ro.disconnect();
    scene.traverse(function(ob){
      if(ob.geometry)ob.geometry.dispose();
      if(ob.material)(Array.isArray(ob.material)?ob.material:[ob.material]).forEach(function(m){if(m.map)m.map.dispose();m.dispose();});
    });
    renderer.dispose();try{renderer.forceContextLoss();}catch(e){}
    cv.remove();
  };
  return api;
}
function mkParams(def,state){
  var o={};
  def.params.forEach(function(p){
    var raw=state&&state.params?state.params[p.key]:undefined,v=(typeof raw==='number')?raw:NaN;
    o[p.key]=isFinite(v)?clamp(v,p.min,p.max):p.value;
  });
  return o;
}
function seeded(seed){var s=seed;return function(){s=(s*16807)%2147483647;return s/2147483647*2-1;};}
/* ---------- Experiments ---------- */
var EXPS={};
function resolveExperiment(expId,state){
  if(expId==='generated'&&state&&state.spec&&window.MUKHTABAR_ENGINE){
    try{return window.MUKHTABAR_ENGINE.createDefinition(state.spec,makeStage,addLights);}catch(e){console.warn('Invalid generated experiment',e);return null;}
  }
  return EXPS[expId]||null;
}
function addLights(S,extra){
  var T=THREE;
  S.add(new T.AmbientLight(0x8fa0c8,0.9));
  var d=new T.DirectionalLight(0xffffff,1.0);d.position.set(3,5,4);S.add(d);
  if(extra){var p=new T.PointLight(0x38bdf8,0.7,40);p.position.set(-4,-2,3);S.add(p);}
}

/* ===== Mitosis ===== */
var MITO_STAGES=[
 {n:'الطور البيني',d:'تتضاعف المادة الوراثية (DNA) داخل النواة، ويكون الكروماتين خيوطاً رفيعة مبعثرة غير مرئية ككروموسومات. هذه المرحلة تسبق الانقسام.'},
 {n:'الطور التمهيدي',d:'يتكثّف الكروماتين إلى كروموسومات، كل كروموسوم من كروماتيدين شقيقين. يبدأ المغزل بالتكوّن وتتجه الجسيمات المركزية نحو القطبين، ويبدأ الغلاف النووي بالتلاشي.'},
 {n:'الطور الاستوائي',d:'تصطف الكروموسومات على المستوى الاستوائي للخلية وترتبط بخيوط المغزل من الجهتين.'},
 {n:'الطور الانفصالي',d:'ينفصل الكروماتيدان الشقيقان، وتسحب خيوط المغزل كلاً منهما إلى قطب معاكس، وتستطيل الخلية.'},
 {n:'الطور النهائي',d:'تصل مجموعتا الكروموسومات إلى القطبين، ويتكوّن غلاف نووي جديد حول كل مجموعة، ويتفكك المغزل.'},
 {n:'انقسام السيتوبلازم',d:'يضيق الغشاء الخلوي عند الوسط حتى تنفصل الخلية إلى خليتين بنتين متطابقتين وراثياً.'}
];
var MK={cond:[0,.8,1,1,.8,.4],align:[0,.3,1,1,1,1],sep:[0,0,0,.45,1,1],elong:[0,0,0,.1,.6,1],pinch:[0,0,0,0,.35,1],spin:[0,.35,1,1,.5,0],nuc:[1,.55,0,0,0,0],dn:[0,0,0,0,.5,.9],pole:[0,1,1,1,1,1],cent:[.6,1,1,1,1,1]};
function kf(a,p){var i=Math.min(4,Math.floor(p));var u=smooth(clamp(p-i,0,1));return a[i]+(a[i+1]-a[i])*u;}

EXPS.mitosis={
 id:'mitosis',field:'bio',icon:'dna',title:'الانقسام المتساوي (الميتوزي)',
 short:'شاهد انقسام الخلية ثلاثي الأبعاد مرحلةً بمرحلة، وتحكم بالتشغيل والتنقل بين الأطوار.',
 params:[{key:'speed',label:'سرعة العرض',min:.2,max:3,step:.1,value:1,unit:'×'}],
 explain:'<h3>الفكرة العلمية</h3><p>الانقسام المتساوي هو العملية التي تنقسم بها الخلية الجسدية إلى خليتين بنتين تحملان نفس عدد الكروموسومات ونفس المعلومات الوراثية للخلية الأم. به ينمو الجسم وتُعوَّض الخلايا التالفة.</p><h3>المراحل</h3><ul><li><b>البيني:</b> تضاعف الـDNA وتحضير الخلية.</li><li><b>التمهيدي:</b> تكثّف الكروموسومات وبدء المغزل.</li><li><b>الاستوائي:</b> اصطفاف الكروموسومات في المنتصف.</li><li><b>الانفصالي:</b> انفصال الكروماتيدين الشقيقين نحو القطبين.</li><li><b>النهائي:</b> تكوّن نواتين جديدتين.</li><li><b>انقسام السيتوبلازم:</b> انشطار الخلية إلى خليتين.</li></ul><h3>ملاحظات على النموذج</h3><p>النموذج مبسّط لأغراض التعلّم: يعرض 4 كروموسومات فقط (الإنسان 46)، وتُعدّ مرحلة البيني والسيتوبلازم مرحلتين مرافقتين للانقسام النووي. استخدم الأزرار أو النقاط المرقّمة فوق المجسّم للتنقل بين المراحل، واسحب بإصبعك للتدوير وبإصبعين للتقريب.</p>',
 make:function(host,state){
  var T=THREE,prm=mkParams(EXPS.mitosis,state);
  var p=(state&&typeof state.p==='number')?clamp(state.p,0,5):0,playing=false,tgt=null,showL=!(state&&state.labels===false),lastP=-1,lastIdx=-1;
  var cur={sx:1,poleX:.9,n:1,c:0,v:0,d:0};
  var st=makeStage(host,{dist:9,th:.5,ph:1.25,fitW:3.5,minR:4,maxR:20,update:tick});
  var S=st.scene;addLights(S,true);
  var mg=new T.SphereGeometry(1.6,44,30);mg.rotateZ(Math.PI/2);
  var base=Float32Array.from(mg.attributes.position.array);
  var mem=new T.Mesh(mg,new T.MeshPhongMaterial({color:0x34d399,transparent:true,opacity:.17,side:T.DoubleSide,depthWrite:false,shininess:90}));
  var wire=new T.Mesh(mg,new T.MeshBasicMaterial({color:0x34d399,wireframe:true,transparent:true,opacity:.06,depthWrite:false}));
  mem.frustumCulled=false;wire.frustumCulled=false;S.add(mem);S.add(wire);
  var nuc=new T.Mesh(new T.SphereGeometry(.9,32,20),new T.MeshPhongMaterial({color:0x6366f1,transparent:true,opacity:.35,depthWrite:false}));
  nuc.add(new T.Mesh(new T.SphereGeometry(.17,16,12),new T.MeshPhongMaterial({color:0x818cf8})));S.add(nuc);
  var dg=new T.SphereGeometry(.6,28,18),dm={color:0x6366f1,transparent:true,opacity:0,depthWrite:false};
  var dn=[new T.Mesh(dg,new T.MeshPhongMaterial(dm)),new T.Mesh(dg,new T.MeshPhongMaterial(dm))];dn.forEach(function(m){S.add(m);});
  var cs=[0,1].map(function(){var m=new T.Mesh(new T.SphereGeometry(.11,16,12),new T.MeshPhongMaterial({color:0xfbbf24,emissive:0xfbbf24,emissiveIntensity:.5}));S.add(m);return m;});
  var cols=[0xf472b6,0xfb923c,0x38bdf8,0xfacc15],plates=[[.5,.2],[-.4,.55],[-.55,-.3],[.3,-.55]],rnd=seeded(7);
  var chg=new T.CylinderGeometry(.075,.075,.6,12,1),chr=[];
  for(var i=0;i<4;i++){
    var tp=new T.Vector3(rnd()*.6,rnd()*.6,rnd()*.6),qT=new T.Quaternion().setFromEuler(new T.Euler(rnd()*3,rnd()*3,rnd()*3));
    [-1,1].forEach(function(sg){
      var m=new T.Mesh(chg,new T.MeshPhongMaterial({color:cols[i],shininess:60,emissive:cols[i],emissiveIntensity:.15}));S.add(m);
      chr.push({m:m,sg:sg,tp:tp,qT:qT,pp:new T.Vector3(0,plates[i][0],plates[i][1]),qP:new T.Quaternion(),cur:new T.Vector3()});
    });
  }
  var lg=new T.BufferGeometry(),lp=new Float32Array(48);lg.setAttribute('position',new T.BufferAttribute(lp,3));
  var lm=new T.LineBasicMaterial({color:0xe2e8f0,transparent:true,opacity:0}),spindle=new T.LineSegments(lg,lm);spindle.frustumCulled=false;S.add(spindle);
  // overlay: stage dots + labels
  var bar=document.createElement('div');bar.className='stagebar';
  bar.innerHTML='<div class="dots">'+MITO_STAGES.map(function(s,i){return '<button class="sdot" data-i="'+i+'" aria-label="'+esc(s.n)+'">'+(i+1)+'</button>';}).join('')+'</div><div class="sname"></div>';
  host.appendChild(bar);
  bar.addEventListener('click',function(e){var b=e.target.closest('.sdot');if(b)go(+b.dataset.i);});
  var layer=document.createElement('div');layer.className='lbls';host.appendChild(layer);
  var V3=function(x,y,z){return new T.Vector3(x,y,z);};
  var LB=[
   ['غشاء الخلية',function(){return V3(-.9*cur.sx,1.38,0);},function(){return true;}],
   ['النواة',function(){return V3(0,.95,0);},function(){return cur.n>.4;}],
   ['كروموسومات',function(){return chr[0].cur.clone().add(V3(0,.5,0));},function(){return cur.c>.6&&p<4.4;}],
   ['خيوط المغزل',function(){return V3(cur.poleX*.55,.05,0);},function(){return cur.v>.5;}],
   ['جسيم مركزي',function(){return V3(cur.poleX,.2,0);},function(){return p<4;}],
   ['نواة ابنة',function(){return V3(-(.07+.85*cur.sx),.8,0);},function(){return cur.d>.45&&p<4.6;}],
   ['خلية ابنة',function(){return V3(-.85*cur.sx,1.2,0);},function(){return p>4.6;}]
  ].map(function(a){var e=document.createElement('div');e.className='lbl';e.textContent=a[0];layer.appendChild(e);return {e:e,pos:a[1],vis:a[2]};});
  function updateLabels(){
    var w=host.clientWidth,h=host.clientHeight;
    LB.forEach(function(l){
      if(!showL||!l.vis()){l.e.style.display='none';return;}
      var v=l.pos().project(st.camera);
      if(v.z>1){l.e.style.display='none';return;}
      l.e.style.display='block';
      l.e.style.left=((v.x*.5+.5)*w)+'px';l.e.style.top=((-v.y*.5+.5)*h)+'px';
    });
  }
  function apply(){
    var c=kf(MK.cond,p),a=kf(MK.align,p),s=kf(MK.sep,p),e=kf(MK.elong,p),k=kf(MK.pinch,p),v=kf(MK.spin,p),n=kf(MK.nuc,p),d=kf(MK.dn,p);
    var sx=1+.7*e,poleX=.9+(1.4*sx-.9)*kf(MK.pole,p);
    cur.sx=sx;cur.poleX=poleX;cur.n=n;cur.c=c;cur.v=v;cur.d=d;
    var pos=mg.attributes.position.array;
    for(var i=0;i<pos.length;i+=3){var x=base[i]*sx,f=1-.97*k*Math.exp(-(x*x)/.2);pos[i]=x;pos[i+1]=base[i+1]*f;pos[i+2]=base[i+2]*f;}
    mg.attributes.position.needsUpdate=true;mg.computeVertexNormals();
    var rf=.35+.65*c,lf=1.5-.5*c;
    chr.forEach(function(o,j){
      var b=o.cur.lerpVectors(o.tp,o.pp,a);
      b.x+=o.sg*(.07+s*.85*sx);b.y*=1-.6*s;b.z*=1-.6*s;
      o.m.position.copy(b);o.m.quaternion.copy(o.qT).slerp(o.qP,a);o.m.scale.set(rf,lf,rf);
      var q=j*6;lp[q]=o.sg*poleX;lp[q+1]=0;lp[q+2]=0;lp[q+3]=b.x;lp[q+4]=b.y;lp[q+5]=b.z;
    });
    lg.attributes.position.needsUpdate=true;lm.opacity=.55*v;spindle.visible=v>.02;
    var cc=kf(MK.cent,p);cs[0].position.set(-poleX,0,0);cs[1].position.set(poleX,0,0);cs[0].scale.setScalar(cc);cs[1].scale.setScalar(cc);
    nuc.material.opacity=.35*n;nuc.visible=n>.02;
    dn[0].position.set(-(.07+.85*sx),0,0);dn[1].position.set(.07+.85*sx,0,0);
    dn.forEach(function(m){m.material.opacity=.38*d;m.visible=d>.02;});
  }
  function updateBar(){
    var idx=Math.min(5,Math.floor(p+.5));
    if(idx===lastIdx)return;lastIdx=idx;
    $$('.sdot',bar).forEach(function(b,i){b.classList.toggle('on',i===idx);});
    $('.sname',bar).textContent=MITO_STAGES[idx].n;
  }
  function tick(dt){
    if(playing){p+=dt*.35*prm.speed;if(p>=5){p=5;playing=false;}}
    else if(tgt!==null){var d=tgt-p,step=dt*1.6*prm.speed;if(Math.abs(d)<=step){p=tgt;tgt=null;}else p+=Math.sign(d)*step;}
    if(p!==lastP){lastP=p;apply();updateBar();}
    updateLabels();
  }
  function go(i){tgt=clamp(i,0,5);playing=false;}
  function idx(){return Math.min(5,Math.floor(p+.5));}
  return {
   params:prm,
   setParam:function(k,v){prm[k]=v;},
   getState:function(){return {params:Object.assign({},prm),p:p,labels:showL};},
   actions:function(){return [
    {icon:'chevron-right',label:'السابق',fn:function(){go(Math.ceil(p-1e-6)-1);}},
    {icon:playing?'pause':'play',label:playing?'إيقاف':'تشغيل',primary:true,fn:function(){if(p>=5)p=0;playing=!playing;tgt=null;}},
    {icon:'chevron-left',label:'التالي',fn:function(){go(Math.floor(p+1e-6)+1);}},
    {icon:'rotate-ccw',label:'إعادة',fn:function(){p=0;playing=false;tgt=null;}},
    {icon:showL?'eye-off':'eye',label:showL?'إخفاء التسميات':'إظهار التسميات',fn:function(){showL=!showL;}}
   ];},
   readouts:function(){return [['المرحلة الحالية',MITO_STAGES[idx()].n],['التقدّم',Math.round(p/5*100)+'%']];},
   info:function(){return MITO_STAGES[idx()].d;},
   dispose:function(){st.dispose();bar.remove();layer.remove();}
  };
 }
};

EXPS.projectile={
 id:'projectile',field:'phy',icon:'crosshair',title:'حركة المقذوفات',
 short:'غيّر زاوية الإطلاق والسرعة والجاذبية وارتفاع الإطلاق، وراقب المسار والمدى.',
 params:[
  {key:'angle',label:'زاوية الإطلاق',min:5,max:85,step:1,value:45,unit:'°'},
  {key:'speed',label:'سرعة الإطلاق',min:5,max:60,step:1,value:25,unit:'م/ث'},
  {key:'gravity',label:'تسارع الجاذبية',min:1,max:25,step:.01,value:9.81,unit:'م/ث²'},
  {key:'height',label:'ارتفاع الإطلاق',min:0,max:30,step:1,value:0,unit:'م'},
  {key:'tscale',label:'سرعة العرض',min:.25,max:3,step:.05,value:1,unit:'×'}
 ],
 explain:'<h3>الفكرة العلمية</h3><p>المقذوف جسم يُطلق ثم تؤثر عليه الجاذبية وحدها (نهمل مقاومة الهواء). الحركة الأفقية بسرعة ثابتة، والحركة الرأسية بتسارع ثابت نحو الأسفل، والحركتان مستقلتان.</p><h3>المعادلات</h3><p><span class="eq">x = v₀·cosθ · t</span></p><p><span class="eq">y = h₀ + v₀·sinθ · t − ½·g·t²</span></p><p>زمن الطيران: <span class="eq">T = (v₀sinθ + √((v₀sinθ)² + 2g·h₀)) / g</span></p><p>المدى: <span class="eq">R = v₀cosθ · T</span> &nbsp; أقصى ارتفاع: <span class="eq">H = h₀ + (v₀sinθ)² / 2g</span></p><h3>جرّب</h3><ul><li>عند h₀ = 0 يكون المدى أكبر ما يمكن عند 45°.</li><li>زاويتان متتامتان (مثل 30° و60°) تعطيان المدى نفسه عندما h₀ = 0.</li><li>بدّل الجاذبية إلى القمر (1.62) أو المريخ (3.71) وراقب المدى.</li></ul><p>السهم الأخضر هو متجه السرعة اللحظية: يتغير اتجاهه وطوله مع الزمن.</p>',
 make:function(host,state){
  var T=THREE,prm=mkParams(EXPS.projectile,state),t=0,playing=true,k=1,M,N=140,dyn=null,trailGeo=null,first=true;
  var st=makeStage(host,{dist:20,th:.35,ph:1.35,target:[7,2,0],fitW:9,minR:5,maxR:90,update:tick});
  var S=st.scene;addLights(S,false);
  var ball=new T.Mesh(new T.SphereGeometry(.22,24,16),new T.MeshPhongMaterial({color:0xfb923c,emissive:0xfb923c,emissiveIntensity:.35}));S.add(ball);
  var arrow=new T.ArrowHelper(new T.Vector3(1,0,0),new T.Vector3(),1.5,0x34d399,.35,.2);S.add(arrow);
  function calc(){
    var a=prm.angle*Math.PI/180,vx=prm.speed*Math.cos(a),vy=prm.speed*Math.sin(a),g=prm.gravity,h0=prm.height;
    var Tt=(vy+Math.sqrt(vy*vy+2*g*h0))/g;
    return {vx:vx,vy:vy,T:Tt,R:vx*Tt,H:h0+vy*vy/(2*g)};
  }
  function rebuild(){
    if(dyn){S.remove(dyn);dyn.traverse(function(o){if(o.geometry)o.geometry.dispose();if(o.material)o.material.dispose();});}
    dyn=new T.Group();S.add(dyn);
    M=calc();k=13/Math.max(M.R,M.H*1.3,1);
    var R=M.R*k,H=M.H*k,h0=prm.height*k,a=prm.angle*Math.PI/180;
    var size=Math.max(Math.ceil(R*1.5+8),26);
    var grid=new T.GridHelper(size,size,0x2a3a66,0x18233f);grid.position.x=R/2;dyn.add(grid);
    var pts=new Float32Array((N+1)*3);
    for(var i=0;i<=N;i++){var tt=M.T*i/N;pts[i*3]=M.vx*tt*k;pts[i*3+1]=Math.max(0,prm.height+M.vy*tt-.5*prm.gravity*tt*tt)*k;pts[i*3+2]=0;}
    var attr=new T.BufferAttribute(pts,3);
    var g1=new T.BufferGeometry();g1.setAttribute('position',attr);
    dyn.add(new T.Line(g1,new T.LineBasicMaterial({color:0x38bdf8,transparent:true,opacity:.35})));
    trailGeo=new T.BufferGeometry();trailGeo.setAttribute('position',attr);trailGeo.setDrawRange(0,1);
    var trail=new T.Line(trailGeo,new T.LineBasicMaterial({color:0xfb923c}));trail.frustumCulled=false;dyn.add(trail);
    var ring=new T.Mesh(new T.RingGeometry(.28,.4,32).rotateX(-Math.PI/2),new T.MeshBasicMaterial({color:0x34d399,side:T.DoubleSide}));ring.position.set(R,.02,0);dyn.add(ring);
    if(h0>0.05){var tw=new T.Mesh(new T.CylinderGeometry(.09,.09,h0,10),new T.MeshPhongMaterial({color:0x64748b}));tw.position.set(0,h0/2,0);dyn.add(tw);}
    var bar=new T.Mesh(new T.CylinderGeometry(.1,.15,1.2,14),new T.MeshPhongMaterial({color:0x94a3b8}));
    bar.rotation.z=a-Math.PI/2;bar.position.set(Math.cos(a)*.6,h0+Math.sin(a)*.6,0);dyn.add(bar);
    st.target.set(R/2,H/2.5,0);
    if(first){first=false;}
    st.place();
  }
  rebuild();
  function pos(){return {x:M.vx*t,y:Math.max(0,prm.height+M.vy*t-.5*prm.gravity*t*t),vy:M.vy-prm.gravity*t};}
  function tick(dt){
    if(playing){t+=dt*prm.tscale*Math.max(1,M.T/6);if(t>=M.T){t=M.T;playing=false;}}
    var q=pos();
    ball.position.set(q.x*k,Math.max(q.y*k,.22),0);
    trailGeo.setDrawRange(0,Math.min(N+1,Math.floor(t/M.T*N)+2));
    var sp=Math.hypot(M.vx,q.vy);
    arrow.position.copy(ball.position);arrow.setDirection(new T.Vector3(M.vx,q.vy,0).normalize());
    arrow.setLength(.8+1.6*sp/Math.max(prm.speed,1),.4,.22);
  }
  return {
   params:prm,
   setParam:function(key,v){prm[key]=v;rebuild();t=0;playing=true;},
   getState:function(){return {params:Object.assign({},prm)};},
   actions:function(){return [
    {icon:'rocket',label:'إطلاق من جديد',primary:true,fn:function(){t=0;playing=true;}},
    {icon:playing?'pause':'play',label:playing?'إيقاف':'استئناف',fn:function(){if(t>=M.T){t=0;}playing=!playing;}},
    {icon:'globe',label:'الأرض 9.81',preset:{gravity:9.81}},
    {icon:'moon',label:'القمر 1.62',preset:{gravity:1.62}},
    {icon:'circle-dot',label:'المريخ 3.71',preset:{gravity:3.71}}
   ];},
   readouts:function(){var q=pos();return [
    ['المدى الأفقي',M.R.toFixed(1)+' م'],['أقصى ارتفاع',M.H.toFixed(1)+' م'],['زمن الطيران',M.T.toFixed(2)+' ث'],
    ['الزمن الحالي',t.toFixed(2)+' ث'],['الارتفاع الحالي',q.y.toFixed(1)+' م'],['السرعة الحالية',Math.hypot(M.vx,q.vy).toFixed(1)+' م/ث'],
    ['مقياس الشبكة','1 مربع = '+(1/k).toFixed(1)+' م']];},
   info:function(){
    if(prm.height===0&&Math.abs(prm.angle-45)<1)return 'زاوية 45° مع ارتفاع إطلاق صفر تعطي أكبر مدى ممكن عند هذه السرعة.';
    return 'المسار المنقّط أزرق هو المسار المتوقع، والمسار البرتقالي هو ما قطعه المقذوف فعلاً. الحلقة الخضراء موضع الهبوط.';
   },
   dispose:function(){st.dispose();}
  };
 }
};

/* ===== Orbit ===== */
function glowTexture(){

  var g=x.createRadialGradient(64,64,0,64,64,64);g.addColorStop(0,'rgba(255,225,140,1)');g.addColorStop(.25,'rgba(255,190,80,.55)');g.addColorStop(1,'rgba(255,160,40,0)');

 ],
 explain:'<h3>الفكرة العلمية</h3><p>يجذب النجم الكوكب بقوة تتناسب عكسياً مع مربع المسافة: <span class="eq">F = G·M·m / r²</span>. المحاكاة تحلّ معادلات الحركة عددياً (طريقة Leapfrog) ولا ترسم مساراً جاهزاً، لذلك تظهر القوانين من تلقاء نفسها.</p><h3>قوانين كبلر</h3><ul><li><b>الأول:</b> المدار قطع ناقص والنجم في إحدى بؤرتيه.</li><li><b>الثاني:</b> الخط الواصل بين النجم والكوكب يمسح مساحات متساوية في أزمنة متساوية، فيتسارع الكوكب عند الاقتراب.</li><li><b>الثالث:</b> <span class="eq">T² ∝ a³</span> وبوحدات (سنة، وحدة فلكية، كتلة شمسية): <span class="eq">T² = a³ / M</span></span></li></ul><h3>الوحدات</h3><p>المسافة بالوحدة الفلكية (و.ف = متوسط بُعد الأرض عن الشمس)، والزمن بالسنة، فتكون <span class="eq">GM = 4π²·M</span>. السرعة = 1 تعني مداراً دائرياً، أما السرعة أكبر من نحو 1.41 فتعني الهروب من جاذبية النجم (مدار مفتوح).</p><h3>تبسيط</h3><p>نهمل كتلة الكوكب أمام النجم (مسألة جسمين)، ولا ندخل أجساماً أخرى.</p>',

function clampParams(expId,raw,notes){
  var def=EXPS[expId],out={};

    var v=raw&&typeof raw[p.key]==='number'?raw[p.key]:NaN;
    if(isFinite(v)){out[p.key]=clamp(v,p.min,p.max);if(notes)notes.push(p.label+': '+out[p.key]+' '+p.unit);}

}
function demoInterpret(text){

  else if(/(تداخل|شقين|شق يونغ|يونغ|double.?slit|interference)/.test(t))id='interference';
  else if(/(حث كهرومغناطيسي|تحريض|فاراداي|مولد كهربائي|ملف دوار|induction|generator)/.test(t))id='induction';
  else if(/(مقذوف|قذيف|قذف|رمي|اطلاق|إطلاق|مدفع|كرة|projectile|launch|cannon|ball|trajectory)/.test(t))id='projectile';
  else if(/(مدار|كوكب|شمس|كبلر|جاذبي|فلك|orbit|planet|kepler|gravit|solar)/.test(t))id='orbit';
  if(!id)return null;
  var raw={};
  function num(re){var m=t.match(re);return m?parseFloat(m[1]):NaN;}
  if(id==='projectile'){
    var a=num(/(?:زاوي[ةه]?|angle)\D{0,6}(\d+(?:\.\d+)?)/);if(!isFinite(a))a=num(/(\d+(?:\.\d+)?)\s*(?:°|درج|deg)/);
    var v=num(/(?:سرع[ةه]|speed|velocity)\D{0,6}(\d+(?:\.\d+)?)/);if(!isFinite(v))v=num(/(\d+(?:\.\d+)?)\s*(?:m\/s|م\/ث)/);
    var h=num(/(?:ارتفاع|height)\D{0,6}(\d+(?:\.\d+)?)/);
    if(isFinite(a))raw.angle=a;if(isFinite(v))raw.speed=v;if(isFinite(h))raw.height=h;
    if(/(قمر|moon)/.test(t))raw.gravity=1.62;else if(/(مريخ|mars)/.test(t))raw.gravity=3.71;else if(/(مشتري|jupiter)/.test(t))raw.gravity=24.8;
  }

    var d=num(/(?:مسافة|distance)\D{0,6}(\d+(?:\.\d+)?)/);if(isFinite(d))raw.dist=d;
  }

      'مخطط التجربة الجديدة: {"schema":"mukhtabar-sim-v1","title":"اسم عربي","field":"physics|biology|chemistry|astronomy|mathematics","engine":"tokamak|wave|pendulum|interference|induction|scene","summary":"وصف قصير","objective":"هدف التجربة","principle":"شرح المبدأ العلمي","formula":"معادلة قصيرة أو فارغ","assumptions":"حدود النموذج","controls":[{"key":"amplitude","label":"السعة","min":0.2,"max":2.5,"step":0.05,"value":1,"unit":"m","description":"تأثير المتغير"}],"objects":[{"type":"sphere|box|cylinder|torus|ring|cone|icosahedron","label":"اسم العنصر","color":"#38bdf8","emissive":"#082e59","position":[0,0,0],"scale":[1,1,1],"rotation":[0,0,0],"motion":{"type":"none|orbit|rotate|pulse|swing|helix","speed":1,"radius":2,"amplitude":0.5,"axis":"x|y|z","control":"amplitude"}}]}',
      'tokamak: صمّم حجرة حلقية تشبه جهاز توكاماك، وبلازما متوهجة، ملفات مغناطيسية، خطوط مجال ثلاثية الأبعاد وجسيمات مشحونة. مفاتيح التحكم field بوحدة T وtemperature بوحدة keV وdensity بوحدة ×10¹⁹ م⁻³. صرّح بأنه نموذج توضيحي وليس حلاً لمعادلات MHD.',
      'wave: موجة جيبية متحركة، وتحكم amplitude وfrequency وspeed.',
      'pendulum: بندول بسيط يتحرك بالجاذبية، وتحكم length وgravity وangle وdamping.',
      'interference: تجربة شقي يونغ: الشاشة تعرض أهداب تداخل مضيئة ومعتمة محسوبة من wavelength بالنانو متر، separation بالملليمتر، distance بالمتر. استخدم هذه المفاتيح الثلاثة.' ,
       'induction: مولد كهربائي بملف نحاسي يدور بين قطبي مغناطيس. أظهر المجال وخطوطه والملف الدوار وموجة الجهد. استخدم مفاتيح field بوحدة T وarea بوحدة m² وturns كعدد صحيح وangularSpeed بوحدة rad/s وresistance بوحدة Ω. طبّق قانون فاراداي ε = −N dΦ/dt مع Φ = BA cos(ωt).',
       'scene: كوّن مشهداً ثلاثي الأبعاد مفهوماً من 2 إلى 8 عناصر مترابطة، مع حركات ذات معنى وليس كرات عشوائية.',
      'أضف 3 إلى 6 متغيرات فقط وبحد أقصى 7. لا تستخدم HTML أو JavaScript أو روابط أو كوداً. لا تخترع قياسات، وصرّح بحدود الدقة عند الحاجة.',
      'أعد JSON صالحاً فقط بلا Markdown أو شرح خارجي.',
      'طلب المستخدم: '+prompt
    ].join("\n");
    var r=await fetch(CFG.AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({history:[{type:'user_input',content:requestPrompt}]}),signal:ctl.signal});
    var envelope=await r.json().catch(function(){return {};});
    if(!r.ok)throw new Error(envelope.error||('HTTP '+r.status));
    if(!envelope||typeof envelope.reply!=='string')throw new Error('رد الخادم غير صالح');
    var txt=envelope.reply.replace(/\x60\x60\x60(?:json)?/gi,'').trim(),match=txt.match(/\{[\s\S]*\}/);
    if(!match)throw new Error('لم يُرجع المساعد إعدادات قابلة للقراءة');
    var j=JSON.parse(match[0]);
    if(!j||typeof j!=='object')throw new Error('صيغة الرد غير صحيحة');
    if(j.kind==='builtin'&&EXPS[j.experimentId]){
      var oldNotes=[],oldParams=clampParams(j.experimentId,j.params||{},oldNotes);
      return {expId:j.experimentId,params:oldParams,notes:oldNotes,note:typeof j.note==='string'?j.note.slice(0,300):''};
    }
    if(!window.MUKHTABAR_ENGINE)throw new Error('محرك التجارب الجديدة لم يُحمّل');
    var rawSpec=j.kind==='generated'?j.experiment:j;
    var spec=window.MUKHTABAR_ENGINE.normalizeSpec(rawSpec),vals={};
    spec.controls.forEach(function(c){vals[c.key]=c.value;});
    var generated=window.MUKHTABAR_ENGINE.createDefinition(spec,makeStage,addLights);
    var notes=generated.params.map(function(p){return p.label+': '+p.value+(p.unit?' '+p.unit:'');});
    return {expId:'generated',spec:generated.spec,params:vals,notes:notes,note:typeof j.note==='string'?j.note.slice(0,300):''};
  }finally{clearTimeout(timer);}
}

function viewViewer(expId,rec){
  var state=rec?rec.state:null;
  if(!rec&&pending&&pending.expId===expId){state=pending.state;}
  var def=resolveExperiment(expId,state);
  if(!def){location.hash='#/home';return;}
  pending=null;
  view.innerHTML='<section class="viewer"><header class="vhead"><button class="icon-btn" data-act="back" aria-label="رجوع">'+ic('arrow-right')+'</button><div class="vt"><b>'+esc(rec?rec.name:def.title)+'</b><small>'+(def.fieldLabel||FIELD[def.field])+'</small></div><button class="btn sm primary" id="saveBtn">'+ic('save')+' حفظ</button></header>'+
   '<div class="stage" id="stage"></div><div class="tabs"><button class="tab on" data-t="ctl">التحكم</button><button class="tab" data-t="exp">الشرح العلمي</button></div>'+
   '<div class="panel"><div id="pCtl"><div class="actions" id="acts"></div><div class="sl" id="viewScaleWrap" hidden><div class="top"><span>حجم المشهد</span><b id="viewScaleValue">50%</b></div><input id="viewScale" type="range" min="0" max="100" step="1" value="50"><small class="mut">اسحب لتكبير أو تصغير الجهاز</small></div><div class="info" id="info"></div><div id="sliders"></div><div class="reads" id="reads"></div></div><div id="pExp" class="exptext" hidden>'+def.explain+'</div></div></section>';
  var host=$('#stage'),inst=null,curRec=rec||null;
  if(!window.THREE){host.innerHTML='<div class="glerr">تعذّر تحميل مكتبة Three.js (تحقق من الاتصال بالإنترنت ثم أعد فتح الصفحة).</div>';}
  else{
    try{inst=def.make(host,state);}
    catch(e){console.error('MUKHTABAR simulation error:',e);var msg=e&&e.message?e.message:String(e||'unknown');host.innerHTML='<div class="glerr"><b>تعذر تشغيل المحاكاة.</b><br><small>'+esc(msg)+'</small><br>إذا استمر الخطأ أرسل هذه الرسالة للدعم.</div>';}
  }
  var scaleWrap=$('#viewScaleWrap'),scaleInput=$('#viewScale'),scaleValue=$('#viewScaleValue');
  if(inst&&typeof inst.setViewScale==='function'){
    scaleWrap.hidden=false;
    scaleInput.value=inst.getViewScale();
    scaleValue.textContent=scaleInput.value+'%';
    scaleInput.addEventListener('input',function(){
      var v=Number(scaleInput.value);
      inst.setViewScale(v);
      scaleValue.textContent=v+'%';
    });
  }
  $$('.tab').forEach(function(b){b.addEventListener('click',function(){
    $$('.tab').forEach(function(x){x.classList.toggle('on',x===b);});
    $('#pCtl').hidden=b.dataset.t!=='ctl';$('#pExp').hidden=b.dataset.t!=='exp';
  });});
  function renderSliders(){
    if(!inst)return;
    $('#sliders').innerHTML=def.params.map(function(p){
      return '<div class="sl"><div class="top"><span>'+esc(p.label)+'</span><b data-v="'+p.key+'">'+inst.params[p.key]+' '+esc(p.unit)+'</b></div><input type="range" min="'+p.min+'" max="'+p.max+'" step="'+p.step+'" value="'+inst.params[p.key]+'" data-k="'+p.key+'"></div>';
    }).join('');
    $$('#sliders input').forEach(function(r){r.addEventListener('input',function(){
      var k=r.dataset.k,p=def.params.filter(function(x){return x.key===k;})[0],v=parseFloat(r.value);
      inst.setParam(k,v);$('[data-v="'+k+'"]').textContent=v+' '+p.unit;
    });});
  }
  var lastSig='',acts=[];
  function renderActions(force){
    if(!inst)return;
    acts=inst.actions();
    var sig=acts.map(function(a){return a.icon+a.label;}).join('|');
    if(!force&&sig===lastSig)return;lastSig=sig;
    $('#acts').innerHTML=acts.map(function(a,i){return '<button class="btn sm '+(a.primary?'primary':'')+'" data-a="'+i+'">'+ic(a.icon)+' '+esc(a.label)+'</button>';}).join('');
    refreshIcons();
  }
  $('#acts').addEventListener('click',function(e){
    var b=e.target.closest('[data-a]');if(!b||!inst)return;
    var a=acts[+b.dataset.a];
    if(a.preset){Object.keys(a.preset).forEach(function(k){inst.setParam(k,a.preset[k]);});renderSliders();}
    else a.fn();
    renderActions(true);
  });
  var lastInfo='';
  function poll(){
    if(!inst)return;
    $('#reads').innerHTML=inst.readouts().map(function(r){return '<div class="kv"><span class="mut">'+esc(r[0])+'</span><b>'+esc(r[1])+'</b></div>';}).join('');
    var inf=inst.info();if(inf!==lastInfo){lastInfo=inf;$('#info').textContent=inf;}
    renderActions(false);
  }
  if(inst){renderSliders();renderActions(true);poll();refreshIcons();}
  var iv=setInterval(poll,250);
  $('#saveBtn').addEventListener('click',async function(){
    if(!inst){toast('لا يمكن الحفظ: المحاكاة لم تعمل');return;}
    var item=await saveFlow(def,inst,curRec);
    if(item){curRec=item;$('.vt b').textContent=item.name;}
  });
  cleanup=function(){clearInterval(iv);if(inst)inst.dispose();};
}

async function saveFlow(def,inst,rec){
  var defName=rec?rec.name:def.title+' — '+fmtDate(Date.now());
  var btns=rec?[{label:'تحديث التجربة المحفوظة',cls:'primary'},{label:'حفظ كنسخة جديدة'},{label:'إلغاء',cls:'ghost'}]:[{label:'حفظ',cls:'primary'},{label:'إلغاء',cls:'ghost'}];
  var r=await modal({title:'حفظ التجربة',html:'<p class="mut sm">تُحفظ التجارب محلياً على هذا المتصفح/الجهاز فقط، ولا تنتقل إلى أجهزتك الأخرى.</p>',input:{value:defName,placeholder:'اسم التجربة'},buttons:btns});
  if(!r)return null;
  if(r.i===btns.length-1)return null;
  var update=!!rec&&r.i===0,now=Date.now();
  var item={id:update?rec.id:uid(),expId:def.id,name:r.value||defName,state:inst.getState(),createdAt:update?rec.createdAt:now,updatedAt:now};
  try{await DB.put(item);DB.persist();toast(update?'تم تحديث التجربة':'تم حفظ التجربة في المكتبة');return item;}
  catch(e){console.error(e);toast('تعذّر الحفظ في هذا المتصفح');return null;}
}

  view.innerHTML='<div class="page"><h1>الإعدادات</h1>'+
   '<div class="card" style="margin-top:14px"><div class="row"><div class="logo">'+ic('user')+'</div><div><b>'+(name?esc(name):'زائر')+'</b><div class="mut sm">'+(inTG?'متصل عبر تيليجرام':'يعمل خارج تيليجرام')+'</div></div></div></div>'+
   '<h2>التخزين</h2><div class="banner">'+ic('info')+'<span>تُحفظ تجاربك في متصفحك (IndexedDB) على هذا الجهاز فقط. حذف بيانات المتصفح أو تغيير الجهاز يعني فقدانها، ولا توجد مزامنة سحابية. استخدم النسخ الاحتياطي أدناه.</span></div>'+
   '<div class="row"><button class="btn" id="exp">'+ic('download')+' تصدير نسخة احتياطية</button><button class="btn" id="imp">'+ic('upload')+' استيراد</button><input type="file" id="file" accept="application/json,.json" hidden></div>'+
   '<h2>الذكاء الاصطناعي</h2><div class="card"><div class="kv"><span class="mut">الحالة</span><b>'+(CFG.AI_ENDPOINT?'مُفعّل':'وضع تجريبي')+'</b></div><p class="mut sm" style="margin:6px 0 0">لتفعيله اضبط AI_ENDPOINT في index.html بعد نشر الـWorker (التفاصيل في README).</p></div>'+
   '<h2>بيانات التطبيق</h2><button class="btn danger" id="clr">'+ic('trash-2')+' حذف كل التجارب المحفوظة</button>'+
   '<p class="mut sm" style="margin-top:20px">المختبر · الإصدار 1.0</p></div>';
  refreshIcons();
  $('#exp').addEventListener('click',async function(){
    var l=await DB.all();
    var blob=new Blob([JSON.stringify({app:'mukhtabar',version:1,items:l},null,1)],{type:'application/json'});
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mukhtabar-backup.json';document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},2000);toast('تم تجهيز النسخة الاحتياطية');
  });
  $('#imp').addEventListener('click',function(){$('#file').click();});
  $('#file').addEventListener('change',async function(e){
    var f=e.target.files[0];if(!f)return;
    try{
      var j=JSON.parse(await f.text()),n=0;
      for(var it of (j.items||[])){
        if(!it||typeof it.id!=='string'||typeof it.state!=='object'||!it.state)continue;
        var importedState=null;
        if(it.expId==='generated'){
          var gd=resolveExperiment('generated',it.state);if(!gd)continue;
          importedState={spec:gd.spec,params:{}};
          gd.params.forEach(function(p){var v=it.state.params&&it.state.params[p.key];importedState.params[p.key]=typeof v==='number'?clamp(v,p.min,p.max):p.value;});
        }else{
          if(!EXPS[it.expId])continue;
          importedState={params:clampParams(it.expId,it.state.params||{}),p:typeof it.state.p==='number'?it.state.p:0,labels:it.state.labels!==false};
        }
        await DB.put({id:it.id.slice(0,64),expId:it.expId,name:String(it.name||'تجربة').slice(0,80),state:importedState,createdAt:+it.createdAt||Date.now(),updatedAt:+it.updatedAt||Date.now()});n++;
      }
      toast('تم استيراد '+n+' تجربة');
    }catch(err){toast('ملف غير صالح');}
    e.target.value='';
  });
  $('#clr').addEventListener('click',async function(){
    if(await confirmDlg('حذف كل التجارب','سيتم حذف جميع تجاربك المحفوظة من هذا الجهاز ولا يمكن التراجع.','حذف الكل')){await DB.clear();toast('تم الحذف');}
  });
}

/* ---------- Router ---------- */
function route(){
  renderId++;
  if(cleanup){try{cleanup();}catch(e){}cleanup=null;}
  var h=location.hash||'#/home';
  if(routeStack[routeStack.length-1]!==h)routeStack.push(h);
  var parts=h.replace(/^#\//,'').split('/'),name=parts[0],arg=decodeURIComponent(parts[1]||'');
  var tab=name,full=false,back=false;
  if(name==='viewer'||name==='open'){full=true;back=true;tab='library';}
  if(name==='saved'){back=true;tab='library';}
  navEl.style.display=full?'none':'flex';
  setBackButton(back);
  navEl.innerHTML=NAV.map(function(n){return '<button data-go="#/'+n[0]+'" class="'+(n[0]===tab?'on':'')+'">'+ic(n[2])+'<span>'+n[1]+'</span></button>';}).join('');
  view.scrollTop=0;
  if(name==='create')viewCreate();
  else if(name==='library')viewLibrary();
  else if(name==='settings')viewSettings();
  else if(name==='saved')viewSaved(arg);
  else if(name==='viewer')viewViewer(arg,null);
  else if(name==='open')DB.get(arg).then(function(r){if(r&&resolveExperiment(r.expId,r.state))viewViewer(r.expId,r);else location.hash='#/library';}).catch(function(){location.hash='#/library';});
  else viewHome();
  refreshIcons();
}

document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');
  if(g){haptic();location.hash=g.dataset.go;return;}
  if(e.target.closest('[data-act="back"]')){haptic();goBack();}
});
window.addEventListener('hashchange',route);
initTelegram();
DB.persist();
route();
})();

</script>
</body>
</html>
